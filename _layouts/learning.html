<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <title>{{ page.title | escape }} · StudentGuide</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f514b'/%3E%3Ctext x='11' y='42' font-family='monospace' font-size='30' fill='white'%3Esg%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/css/learning/site.css' | relative_url }}">
  {% if page.course %}<script type="module" src="{{ '/assets/js/learning/course.mjs' | relative_url }}"></script>{% elsif page.topic %}<script type="module" src="{{ '/assets/js/learning/progress.mjs' | relative_url }}"></script>{% endif %}
  <script type="application/json" id="curriculum-data">{{ site.data.curriculum | jsonify }}</script>
  <script type="application/json" id="terms-data">{{ site.data.terms | jsonify }}</script>
</head>
<body data-baseurl="{{ site.baseurl }}" data-topic="{{ page.topic | default: page.course }}"{% if page.course %} data-course="{{ page.course }}" data-module="{{ page.module_id }}"{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="StudentGuide home"><span class="brand-mark" aria-hidden="true">[sg]</span>StudentGuide</a>
    <nav aria-label="Main navigation">
      <a href="{{ '/modules/' | relative_url }}"{% if page.course or page.kind == 'catalog' %} aria-current="page"{% endif %}>Learning paths</a>
      <a href="{{ '/guides/' | relative_url }}">Reference guides <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main"{% if page.course %} class="course-shell"{% endif %}>
    {{ content }}
  </main>
  <footer class="site-footer"><span>StudentGuide · Learn by exploring.</span><a class="source-link" href="https://github.com/itshaihong/StudentGuide/tree/codex/interactive-learning">Source</a></footer>
</body>
</html>
